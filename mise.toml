[env]
LUA_PATH = "{{config_root}}/nvim/lua/?.lua;;"

[tasks]
format = "TREEFMT_INJECTED=1 treefmt"
test = [
    "busted .",
]
lint = [
    "lua-language-server --check=nvim",
    "nil diagnostics --deny-warnings **/*.nix",
    "shellcheck **/*.sh bin/*",
]

[hooks]
enter = "test -f \"$(git rev-parse --git-path hooks/pre-commit)\" || prek install"
