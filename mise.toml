[env]
LUA_PATH = "{{config_root}}/nvim/lua/?.lua;;"

[tasks]
format = [
    "stylua .",
    "treefmt",
    "shfmt -w .",
    "taplo format .",
    "biome format --write --json-parse-allow-comments=true --indent-style=space --indent-width=4 cmux/cmux.json",
]
test = [
    "busted .",
]
lint = [
    "lua-language-server --check=nvim",
    "nil diagnostics --deny-warnings **/*.nix",
    "shellcheck **/*.sh bin/*",
]
